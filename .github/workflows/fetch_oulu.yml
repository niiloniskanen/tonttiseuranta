name: Fetch Oulu Päätökset

on:
  schedule:
    - cron: '0 7 * * *'   # Aja joka päivä klo 07:00 UTC (klo 09:00 Suomessa)
  workflow_dispatch:       # Mahdollistaa manuaalisen ajon GitHubista

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas pdfplumber

      - name: Run tonttiseuranta script
        run: python scripts/tonttiseuranta.py

      - name: Upload CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: oulu_viranhaltijapaatokset
          path: data/oulu_viranhaltijapaatokset.csv
