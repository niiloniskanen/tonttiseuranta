name: Fetch Oulu Päätökset

on:
  schedule:
    - cron: '0 6 * * *'   # Aja joka päivä klo 07:00 UTC (klo 08:00 Suomessa)
  workflow_dispatch:       # Mahdollistaa manuaalisen ajon GitHubista

permissions:
  contents: write   # sallitaan workflowlle oikeus puskea muutoksia repoosi

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas

      - name: Run tonttiseuranta script
        run: python scripts/tonttiseuranta.py
        # HUOM: jos tonttiseuranta.py on juurikansiossa, käytä:
        # run: python tonttiseuranta.py

      - name: Commit and push updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/oulu_viranhaltijapaatokset.csv

          if git diff --cached --quiet; then
            echo "Ei muutoksia CSV:ssä, ei commitia."
          else
            git commit -m "Päivitä Oulun viranhaltijapäätökset CSV [skip ci]"
            git push
          fi
